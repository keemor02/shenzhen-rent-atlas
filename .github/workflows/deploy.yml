name: Build & Deploy Web

on:
  push:
    branches:
      - main
      - master
      - v2-rebuild
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Clean dist/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build offline bundle and verify tests
        run: |
          npm run build
          npm run check
          npm test

      - name: Build clean web dist/ with PWA support
        run: |
          npm run build:web
          npm run deploy:check
          ls -lh dist/

      - name: Upload GitHub Pages artifact
        if: ${{ vars.DISABLE_GH_PAGES != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: ${{ vars.DISABLE_GH_PAGES != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
