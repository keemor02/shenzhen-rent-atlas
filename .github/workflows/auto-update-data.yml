name: Auto Update Rental Data

on:
  schedule:
    # 每周一 北京时间 09:00：刷新保租房过期状态 + 巡检深圳住建局新公告
    - cron: '0 1 * * 1'
    # 每月 5 号 北京时间 09:30：拉取核验最新月度租金行情 + 保租房状态
    - cron: '30 1 5 * *'
  workflow_dispatch:
    inputs:
      scope:
        description: '选择要更新的数据范围'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - affordable
          - districts
          - all
          - dry-run

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: auto-update-data
  cancel-in-progress: false

jobs:
  update:
    name: Fetch, Verify & Commit Updated Data
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine update flags
        id: plan
        run: |
          SCOPE="${{ inputs.scope }}"
          if [ -z "$SCOPE" ]; then
            if [ "${{ github.event.schedule }}" = "30 1 5 * *" ]; then
              SCOPE="all"
            else
              SCOPE="affordable"
            fi
          fi
          case "$SCOPE" in
            affordable) FLAGS="--affordable" ;;
            districts)  FLAGS="--districts" ;;
            all)        FLAGS="--all" ;;
            dry-run)    FLAGS="--all --dry-run" ;;
            *)          FLAGS="--affordable --districts" ;;
          esac
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run verified data updater
        run: node tools/update_data.cjs ${{ steps.plan.outputs.flags }}

      - name: Attach report to workflow summary
        if: always()
        run: |
          if [ -f update-report.md ]; then
            cat update-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rebuild bundle and run full test gate
        if: ${{ steps.plan.outputs.scope != 'dry-run' }}
        run: |
          npm run build
          npm run check
          npm test
          npm run build:web
          npm run deploy:check

      - name: Commit & push verified snapshot if changed
        id: commit
        if: ${{ steps.plan.outputs.scope != 'dry-run' }}
        run: |
          git add sources/v3/affordable-housing.json data/base.json data/fine.json data/atlas-v3.json index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
            exit 0
          fi
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          git config user.name "sz-rent-atlas-bot[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): auto-update verified snapshot ${TODAY}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open notice issue when new official housing announcements are detected
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync('update-report.md')) return;
            const report = fs.readFileSync('update-report.md', 'utf8');
            if (!report.includes('条住建局候选新公告')) return;
            const today = new Date(Date.now() + 8 * 3600000).toISOString().slice(0, 10);
            const title = `[保租房巡检] 发现深圳住建局候选新公告 (${today})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 20,
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `${report}\n\n---\n> 由自动巡检任务生成：请人工核验官方链接中的房源数量、基准租金、面向人群与截止时间，再补充至 \`sources/v3/affordable-housing.json\`。`,
            });

  redeploy:
    name: Trigger GitHub Pages Redeploy
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
