<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f2328">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>深圳租房板块探索地图</title>
<style>{{app/app.css}}</style>
</head>
<body>
<header class="topbar" aria-label="探索控制栏">
  <div class="tb-left">
    <span class="brand-mark">深圳租房</span>

    <div class="search-wrap" id="search-wrap">
      <div class="search-box needs-dest" id="search-box">
        <span class="search-ico" aria-hidden="true">⌕</span>
        <input id="omni-input" type="text" autocomplete="off" placeholder="① 先设目的地（园区 / 商圈 / 地铁 / 小区）…">
      </div>
      <div id="omni-pop" class="popover omni-pop" hidden></div>
    </div>
  </div>

  <!-- 目的地 → 通勤方式 → 时长上限 一体化联动胶囊（直属 topbar，桌面居中单行、手机干净独占第二行！） -->
  <div id="commute-hub" class="commute-hub" hidden aria-label="目的地与通勤联动控制">
    <div id="work-pill" class="work-pill"></div>
    <span class="hub-arrow" aria-hidden="true">←</span>
    <div class="mode-pills" id="mode-seg" role="group" aria-label="出行方式">
      <button type="button" data-mode="rail" aria-pressed="true">地铁</button>
      <button type="button" data-mode="bus" aria-pressed="false">公交</button>
      <button type="button" data-mode="drive" aria-pressed="false">驾车</button>
    </div>
    <div class="mode-pills peak-pills" id="peak-seg" role="group" aria-label="出行时段" title="平峰为路网基准；早高峰叠加深圳地铁限流排队或早高峰潮汐拥堵估算">
      <button type="button" data-peak="0" aria-pressed="true">平峰</button>
      <button type="button" data-peak="1" aria-pressed="false">早高峰</button>
    </div>
    <label class="limit-pill" title="单程通勤时长上限">
      <span class="limit-tag">≤<strong id="limit-readout">50分</strong></span>
      <input id="limit-range" type="range" min="15" max="90" step="5" value="50" aria-label="单程通勤上限">
    </label>
  </div>

  <div class="tb-filters" aria-label="居住要求">
    <div class="pop-anchor">
      <button type="button" id="req-btn" class="pill-btn" aria-expanded="false"><span id="req-btn-label">居住要求 ▾</span><span id="extra-badge" class="badge-dot" hidden></span></button>
      <div id="req-pop" class="popover req-pop" hidden>
        <div class="pop-head">
          <strong>居住要求与视图</strong>
          <button type="button" id="reset-all" class="link-btn">重置全部</button>
        </div>
        <div class="filter-rows">
          <div class="f-row">
            <span class="f-label">期望居住面积（㎡）<span class="f-hint">填后全图实时算估月租</span></span>
            <div class="sqm-row">
              <label class="sqm-input-box"><input id="sqm-input" type="number" min="10" max="260" step="5" placeholder="不限"><span>㎡</span></label>
              <div class="sqm-chips" id="sqm-chips">
                <button type="button" data-sqm-quick="0">单价</button>
                <button type="button" data-sqm-quick="25">25㎡</button>
                <button type="button" data-sqm-quick="35">35㎡</button>
                <button type="button" data-sqm-quick="50">50㎡</button>
                <button type="button" data-sqm-quick="70">70㎡</button>
              </div>
            </div>
          </div>

          <div class="f-row">
            <label class="f-col"><span>月租预算上限（元）</span><input id="budget-input" type="number" min="500" max="100000" step="100" placeholder="不限，填后自动过滤超预算片区"></label>
          </div>

          <div class="f-divider"></div>

          <div class="f-row-2">
            <label class="f-col"><span>备选工作地（兼顾下一份）</span><input id="work2-input" type="text" list="dest-options" autocomplete="off" placeholder="选填，如 企鹅岛"></label>
            <label class="f-col"><span>备选通勤上限(分)</span><input id="limit2-input" type="number" min="10" max="120" step="5" placeholder="不限"></label>
          </div>

          <div class="f-row">
            <button type="button" id="macro-toggle-btn" class="pill-btn" style="width:100%;justify-content:center" data-toggle-macro aria-pressed="false">查看全城各区均价总览</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tb-right">
    <button type="button" id="watchlist-btn" class="pill-btn" aria-pressed="false">★ <span class="wl-lbl">看房 PK </span><span id="saved-count">0</span></button>
    <div class="pop-anchor">
      <button type="button" id="help-btn" class="icon-btn" title="数据说明" aria-expanded="false">?</button>
      <div id="help-pop" class="popover help-pop" hidden></div>
    </div>
  </div>
  <datalist id="dest-options"></datalist>
</header>

<main class="stage" id="stage">
  <svg id="atlas-svg" tabindex="0" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="深圳租房片区探索地图，可缩放拖动"></svg>

  <div class="hud-top-left">
    <!-- 极简左上悬浮「★ Top 5 推荐榜 + 画像权重」胶囊（默认收起，点开即看） -->
    <div id="rank-panel" class="rank-panel">
      <button type="button" id="rank-toggle-btn" class="rank-toggle-btn" aria-expanded="false">★ Top 5 推荐 ▾</button>
      <div id="rank-body" class="rank-body" hidden></div>
    </div>
    <div id="status-bar" class="hud-toast" role="status" hidden></div>
  </div>

  <!-- 零点击悬停片区速览卡（随鼠标轻浮，零重绘） -->
  <div id="hover-card" class="hover-card" hidden aria-hidden="true"></div>

  <div class="dock-bottom">
    <div id="sub-pill-row" class="sub-pill-row" hidden></div>
    <div class="dock-bar">
      <!-- 1. 房源轨道分离：市场租房 vs 政府保租房 -->
      <div class="track-seg" id="track-seg" role="group" aria-label="房源类别切换">
        <button type="button" data-track="market" aria-pressed="true" title="城中村民房、老小区、电梯小区、商业公寓">市场房</button>
        <button type="button" data-track="affordable" aria-pressed="false" title="政府保障性租赁住房（申请中 / 往期 / 在建）">保租房</button>
      </div>

      <!-- 2. 核心三视角（推荐分 / 租金 / 通勤） -->
      <div class="layer-dock" id="layer-dock" role="group" aria-label="地图核心视角开关（可多选组合）">
        <button type="button" data-layer="score" aria-pressed="true"><i class="ld-dot"></i>推荐分</button>
        <button type="button" data-layer="rent" aria-pressed="true"><i class="ld-dot"></i>租金</button>
        <button type="button" data-layer="commute" aria-pressed="false"><i class="ld-dot"></i>通勤</button>
      </div>
      <div class="layer-dock" id="aff-dock" role="group" aria-label="保租房批次筛选" hidden></div>

      <!-- 3. 统一收纳「进阶数据叠加 + 地图标点与事件筛选」 -->
      <div class="pop-anchor">
        <button type="button" id="map-filter-btn" class="map-filter-btn" aria-expanded="false">筛选 <span id="map-filter-badge" class="mf-badge" hidden></span>▾</button>
        <div id="map-filter-pop" class="popover map-filter-pop" hidden></div>
      </div>
    </div>
    <div id="map-legend" class="map-legend"></div>
  </div>

  <div class="controls-bottom-right" id="map-controls">
    <div id="overlay-filter-row" class="overlay-filter-row" hidden></div>
    <div class="ctrl-stack">
      <div class="zoom-box" id="zoom-box" aria-label="缩放">
        <button type="button" data-zoom="in" title="放大">+</button>
        <button type="button" data-zoom="out" title="缩小">−</button>
        <button type="button" data-zoom="reset" title="全深圳">⛶</button>
      </div>
    </div>
  </div>

  <aside class="drawer" id="detail-drawer" aria-live="polite" hidden></aside>
  <section id="watchlist-overlay" class="watchlist-overlay" hidden aria-label="我的看房清单"></section>
</main>

<script type="application/json" id="atlas-v3-data">{{data/atlas-v3.json}}</script>
<script type="application/json" id="journey-data">{{data/journey.json}}</script>
<script type="application/json" id="time-data">{{data/timing.json}}</script>
<script>
{{app/rail.js}}
{{app/bus.js}}
{{app/map-camera.js}}
</script>
<script>
{{app/store.js}}
{{app/engine.js}}
{{app/map.js}}
{{app/ui.js}}
</script>
</body>
</html>
