<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>在 Codex 中审查深圳租房地图</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color-scheme:light dark}body{max-width:620px;margin:12vh auto;padding:0 22px;line-height:1.65}h1{font-size:27px}a{display:inline-block;color:#fff;background:#176247;border-radius:7px;padding:8px 16px;text-decoration:none}code{overflow-wrap:anywhere}button{font:inherit;margin-top:8px;padding:4px 10px;cursor:pointer}#info{font-size:13px}
</style></head><body>
<h1>审查深圳租房地图</h1>
<p>本次审查将使用这个项目目录。</p><code id="folder"></code>
<p><a id="open" hidden>打开 Codex 审查对话</a></p>
<p id="info">在桌面端打开后，发送预填的指令即可开始。若这里显示的目录与你已建项目不同，请把压缩包内容解压到目标文件夹，再从那里打开本页。</p>
<details><summary>手动发送审查指令</summary><p id="prompt">读取 AGENTS.md 和 REVIEW.md，从头到尾执行项目审查。复现已有记录，检查真实浏览器的桌面和移动布局、通勤筛选、公共事件、手记与联网回退。修复能复现的问题，重新构建并运行全部测试，在 AUDIT.md 中记录验证结果、未验证项和剩余风险。</p><button id="copy">复制指令</button><span id="status" role="status"></span></details>
<script>
'use strict';
const folder = document.getElementById('folder'), link = document.getElementById('open');
const prompt = document.getElementById('prompt').textContent.trim();
if (location.protocol === 'file:') {
  const directory = new URL('.', location.href);
  let path = decodeURIComponent(directory.pathname);
  if (directory.host) path = '//' + directory.host + path;
  if (/^\/[A-Za-z]:\//.test(path)) path = path.slice(1);
  if (/^[A-Za-z]:\/|^\/\//.test(path)) path = path.replaceAll('/', '\\');
  if (path.length > 3) path = path.replace(/[\\/]$/, '');
  folder.textContent = path;
  link.href = 'codex://new?path=' + encodeURIComponent(path) + '&prompt=' + encodeURIComponent(prompt);
  link.hidden = false;
} else {
  folder.textContent = '请先解压项目文件，再从电脑的项目文件夹打开本页。';
}
document.getElementById('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(prompt); document.getElementById('status').textContent=' 已复制'; }
  catch { const selection=getSelection(), range=document.createRange(); range.selectNodeContents(document.getElementById('prompt'));selection.removeAllRanges();selection.addRange(range);document.getElementById('status').textContent=' 已选中，可复制'; }
};
</script></body></html>
