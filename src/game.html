<main id="game">
  <div class="mission">
    <form id="dest-form"><label for="dest-input">工作地</label><div class="dest-entry"><input type="text" autocomplete="off" id="dest-input" list="dest-options" placeholder="园区、地铁站或简称" required><datalist id="dest-options"></datalist><button type="submit">确定</button></div></form>
    <label class="mission-budget">月租预算（元）<input id="budget" type="number" min="1" max="1000000" placeholder="不限"></label>
    <label>居室<select id="room"><option value="1">一室</option><option value="2">二室</option><option value="3">三室</option><option value="4">四室</option><option value="">不限</option></select></label>
    <label class="place-search">搜片区/街道<input id="place-jump" type="text" list="place-options" autocomplete="off" placeholder="街道、片区或小区"></label><datalist id="place-options"></datalist>
    <div class="quick-dests" aria-label="常用工作地"></div>
  </div>
  <div id="dest-error" role="status"></div>
  <div id="play-controls" hidden>
    <div class="mode-line"><div class="mode-set" aria-label="通勤方式"><button data-mode="rail">地铁</button><button data-mode="bus">公交</button><button data-mode="drive">驾车</button></div><label class="range-label">单程 <strong id="limit-value">50 分钟</strong><input aria-label="单程时间上限" id="time-limit" type="range" value="50" min="10" max="90" step="5"></label></div>
  </div>
  <details id="more-filters" class="more-filters"><summary>更多筛选<span id="filter-badge"></span></summary>
    <div id="route-filters" class="route-filters">
      <label>面积下限（㎡）<input id="sqm" type="number" min="1" max="1000" step="any" placeholder="不限"></label>
      <label>出发接驳（分）<input id="access" type="number" min="0" max="60" value="5"></label><label>到岗步行（分）<input id="egress" type="number" min="0" max="60" value="5"></label>
      <label id="corridor-label">经由线路<select id="corridor"><option value="">不限</option></select></label>
      <label>第二工作地<input id="second-dest" type="text" list="dest-options" autocomplete="off" placeholder="选填站点或园区"></label>
      <label>第二程上限（分）<input id="second-limit" type="number" min="1" max="240" placeholder="不限"></label>
      <button type="button" id="reset-filters" class="subtle">重置筛选</button>
    </div>
  </details>
  <div class="theme-band"><div id="map-topics" class="topic-row" role="group" aria-label="地图主题">
    <button type="button" data-topic="rent" aria-pressed="true">片区月租</button><button type="button" data-topic="commute" aria-pressed="false">通勤</button><button type="button" data-topic="market" aria-pressed="false">片区事件</button><button type="button" data-topic="convenience" aria-pressed="false">生活便利</button><span class="topic-sep" aria-hidden="true"></span><button type="button" data-topic="districtRent" aria-pressed="false">租金行情</button><button type="button" data-topic="density" aria-pressed="false">人口密度</button><button type="button" data-topic="environment" aria-pressed="false">环境</button><button type="button" data-topic="fit" aria-pressed="false">个人适配</button>
  </div><div id="topic-options" hidden></div></div>
  <div class="play-layout"><section class="play-map" aria-label="探索地图">
    <div class="stage-head"><nav id="map-crumbs" aria-label="当前地图范围"></nav><span id="stage-title"></span><span id="hover-hud" class="hover-hud"></span>
      <div class="map-switches"><button id="scope-chip" type="button" hidden></button><button id="event-toggle" type="button" aria-pressed="true">公共事件</button><button id="event-filter-toggle" type="button" aria-expanded="false" hidden>事件分类</button><div class="stage-views" hidden><button data-layout="geo">街区</button><button data-layout="radial">时间圈</button></div></div></div>
    <div class="map-canvas"><svg id="orbit" tabindex="0" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="深圳探索地图，可缩放、拖动及用方向键平移"></svg>
      <div class="map-zoom" id="game-zoom" aria-label="地图视野"><button type="button" data-zoom="in" aria-label="放大" title="放大">+</button><button type="button" data-zoom="out" aria-label="缩小" title="缩小">−</button><button type="button" data-zoom="reset" aria-label="全图" title="全图">⛶</button></div></div>
    <div class="stage-foot"><div id="stage-key" aria-label="地图图例"></div><button type="button" id="discover" hidden>发现下一处</button></div>
    <div id="event-legend" class="event-legend" role="group" aria-label="公共事件图例与筛选" hidden></div>
    <div id="west-key" class="west-key" hidden><span class="zone-key">站点参考区 · 直线 1.8 公里内就近分区</span><span class="home-key"><i class="village-line"></i>城中村 <i class="estate-line"></i>小区 · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap 贡献者</a></span></div>
  </section><aside id="probe" aria-live="polite"></aside></div>
  <p id="decision-status" role="status"></p>
  <div class="candidate-controls"><label><input type="checkbox" id="only-saved"> 只看收藏</label><span class="saved-backup"><button type="button" id="saved-matrix-toggle" aria-expanded="false" hidden>对比已收藏</button><button type="button" id="export-saved">导出收藏</button><label class="backup-import">导入收藏<input type="file" id="import-saved" accept="application/json,.json" hidden></label></span></div>
  <section id="saved-matrix" hidden></section>
  <section id="world-ledger"></section><div id="result-list"></div>
  <details class="map-notes"><summary>数据口径</summary>
    <p>片区月租取符合筛选条件的最低月租样本，通勤取最短单程。两项可能来自不同住处。各区行情按来源的住房类型和统计期展示。</p>
    <details id="fit-method"><summary>适配分</summary><p>通勤与月租按所设上限评分。已有的个人环境和便利评价计入适配，缺项显示为分数区间。公开设施显示已核实的覆盖情况。</p></details>
    <details id="game-method"><summary>通勤与月租</summary><div id="method-text"></div></details>
  </details>
</main>
