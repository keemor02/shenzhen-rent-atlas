<main id="fine" hidden>
  <div class="fine-toolbar">
    <div class="fine-metrics" aria-label="地图主题"><button type="button" data-view="price">租金</button><button type="button" data-view="growth">涨跌</button><button type="button" data-view="now">现状</button><button type="button" data-view="outlook">预期</button></div>
    <details id="fine-filter-drawer"><summary>筛选</summary><div class="fine-filters" id="fine-filters"></div></details>
  </div>
  <div class="fine-work">
    <section class="fine-cartography" aria-label="地图">
      <div class="geo-tools" id="geo-tools"></div>
      <div class="map-canvas"><svg id="fine-map" tabindex="0" role="group" aria-label="深圳街道与片区地图" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="map-zoom" aria-label="地图视野"><button type="button" data-zoom="in" title="放大" aria-label="放大">+</button><button type="button" data-zoom="out" title="缩小" aria-label="缩小">−</button><button type="button" data-zoom="reset" title="全图" aria-label="全图">⛶</button></div></div>
      <div id="fine-legend" class="fine-legend"></div>
      <div id="fine-west-key" class="west-key" hidden><span class="zone-key">站点参考区 · 直线 1.8 公里内就近分区</span><span class="home-key"><i class="village-line"></i>城中村 <i class="estate-line"></i>小区 · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap 贡献者</a></span></div>
      <div id="fine-event-key" class="event-legend" hidden></div>
    </section>
    <section class="fine-inspector" id="fine-inspector" aria-live="polite"></section>
  </div>
</main>
