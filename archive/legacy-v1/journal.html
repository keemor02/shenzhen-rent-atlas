<section id="journal" hidden><div class="journal-head"><h2>我的寻房手记</h2><button class="subtle" id="custom-toggle">补充一个片区</button></div>
<form id="custom-form" hidden><label>片区或小区名<input id="custom-name" maxlength="60" required></label><label>最近的地铁站<input id="custom-station" list="only-stations" autocomplete="off" required><datalist id="only-stations"></datalist></label><label>整租月租（元）<input id="custom-price" type="number" min="1" max="1000000"></label><label>面积（㎡）<input id="custom-area" type="number" min="1" max="1000" step="any"></label><label>居室<select id="custom-room"><option value="">未知</option><option value="1">一室</option><option value="2">二室</option><option value="3">三室</option><option value="4">四室</option></select></label><label>观察或来源<input id="custom-note" maxlength="500" placeholder="例如看房日期、楼栋、晚间噪音"></label><button type="submit">加入手记</button><span id="custom-error" role="status"></span></form>
<div id="journal-list"></div><div class="journal-ops"><button id="export-book" class="subtle">导出手记</button><label class="subtle">导入手记<input id="import-book" type="file" accept=".json,application/json"></label><span id="journal-status" role="status"></span></div></section>
